name: Build CainWyn VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter config Java
        run: |
          flutter config --jdk-dir $JAVA_HOME
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs || echo "skip build_runner"

      - name: Slang
        run: dart run slang || echo "skip slang"

      - name: Prepare assets
        run: |
          mkdir -p assets/core
          curl -L https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db -o assets/core/geoip.db || true
          curl -L https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db -o assets/core/geosite.db || true

      - name: Prepare Android core
        run: |
          mkdir -p android/app/libs
          make android-libs || true
          ls -R android/app/libs || echo "continue"

      - name: Build APK release
        run: flutter build apk --release --verbose

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CainWynVPN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CainWynVPN-APK
          path: CainWynVPN.apk
          retention-days: 30
