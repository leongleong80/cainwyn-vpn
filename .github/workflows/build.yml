name: CainWyn VPN Secure Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and Rebuild Android Directory
        run: |
          echo "Deleting old android directory..."
          rm -rf android
          echo "Generating new android directory..."
          flutter create --platforms=android .
          echo "Restoring custom AndroidManifest.xml..."
          # 这里我们使用 GitHub 上的历史文件或直接覆盖（见下方说明）
          
      - name: Get Dependencies
        run: |
          flutter pub get
          flutter pub upgrade

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CainWynVPN-Secure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CainWynVPN-Secure
          path: CainWynVPN-Secure.apk
