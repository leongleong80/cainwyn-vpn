
name: CainWyn VPN Secure Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. 核心洗底：删除旧的 android 目录，重建纯净工程
      - name: Clean and Rebuild Android Directory
        run: |
          rm -rf android
          flutter create --platforms=android --project-name cainwyn_vpn
          
      # 2. 恢复你的 AndroidManifest.xml（注入网络权限和 App 名字）
      - name: Restore AndroidManifest.xml
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="CainWyn VPN"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>
          EOF

      # 3. 恢复你的 MainActivity.kt（确保包名是 com.cainwyn.vpn）
      - name: Restore MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/cainwyn/vpn/
          cat << 'EOF' > android/app/src/main/kotlin/com/cainwyn/vpn/MainActivity.kt
          package com.cainwyn.vpn

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

      # 4. 强制修改包名（防止 flutter create 生成默认的 com.example.cainwyn_vpn）
      - name: Fix Application ID in build.gradle
        run: |
          sed -i 's/namespace = "com.example.cainwyn_vpn"/namespace = "com.cainwyn.vpn"/' android/app/build.gradle
          sed -i 's/applicationId = "com.example.cainwyn_vpn"/applicationId = "com.cainwyn.vpn"/' android/app/build.gradle

      - name: Get Dependencies
        run: |
          flutter pub get
          flutter pub upgrade

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CainWynVPN-Secure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CainWynVPN-Secure
          path: CainWynVPN-Secure.apk
