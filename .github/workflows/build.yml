name: CainWyn VPN Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Flutter Latest Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install make and curl
        run: sudo apt-get update && sudo apt-get install -y make curl

      - name: Get Dependencies
        run: flutter pub get

      - name: Download Hiddify Core and Geo Assets
        run: |
          mkdir -p assets/core
          curl -L https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db -o assets/core/geoip.db || true
          curl -L https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db -o assets/core/geosite.db || true
          mkdir -p android/app/libs
          make android-libs || true

      - name: Build APK release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CainWynVPN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CainWynVPN
          path: CainWynVPN.apk
