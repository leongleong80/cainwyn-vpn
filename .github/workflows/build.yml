name: CainWyn VPN Secure Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CainWynVPN-Secure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CainWynVPN-Secure
          path: CainWynVPN-Secure.apk
      
      - name: Search for v1 embedding leftovers
        run: grep -rn "io.flutter.app" . --include="*.xml" --include="*.java" --include="*.kt"
